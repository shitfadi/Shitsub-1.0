<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E50914">
<title>ShitSub</title>

<style>
:root {
  --red: #E50914;
  --red-dark: #B00610;
  --bg: #ffffff;
  --card: #f6f6f6;
  --text: #111111;
  --muted: #6b6b6b;
  --border: #dddddd;
  --success: #16803c;
  --danger: #b00020;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 30px 22px 60px;
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

.logo {
  color: var(--red);
  font-size: 46px;
  font-weight: 900;
  letter-spacing: -2px;
}

.tagline {
  margin-top: 6px;
  color: var(--muted);
  font-size: 15px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
}

.section-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
}

input[type="text"],
input[type="password"],
textarea {
  width: 100%;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: #ffffff;
  color: var(--text);
  padding: 14px;
  font-size: 16px;
  outline: none;
}

input[type="text"]:focus,
input[type="password"]:focus,
textarea:focus {
  border-color: #111111;
}

textarea {
  min-height: 220px;
  resize: vertical;
  line-height: 1.5;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}

.checkbox-row input {
  width: 20px;
  height: 20px;
  margin: 0;
}

.file-input {
  width: 100%;
  background: #ffffff;
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 15px;
  font-size: 15px;
}

button {
  min-height: 52px;
  border-radius: 12px;
  border: none;
  padding: 14px 20px;
  font-size: 17px;
  font-weight: 800;
}

.primary-btn {
  width: 100%;
  background: var(--red);
  color: #ffffff;
}

.primary-btn:hover {
  background: var(--red-dark);
}

.secondary-btn {
  width: 100%;
  background: #ffffff;
  color: #111111;
  border: 2px solid var(--border);
}

.save-btn {
  width: 100%;
  background: var(--success);
  color: #ffffff;
  margin-top: 12px;
}

.download-btn {
  width: 100%;
  background: #111111;
  color: #ffffff;
}

.prompt-editor {
  display: none;
}

.prompt-info {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 10px;
}

.status-card {
  display: none;
}

.status-text {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
}

.progress-container {
  width: 100%;
  height: 12px;
  margin-top: 15px;
  background: #dddddd;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: var(--red);
  transition: width 0.25s ease;
}

.result-card {
  display: none;
}

.result-info {
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 15px;
}

.error {
  color: var(--danger);
  font-weight: 700;
  line-height: 1.5;
  margin-top: 12px;
}

.success {
  color: var(--success);
  font-weight: 700;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin-top: 30px;
}

button:focus,
input:focus,
textarea:focus {
  outline: 4px solid rgba(229, 9, 20, 0.45);
  outline-offset: 2px;
}

@media (min-width: 900px) {

  .app {
    max-width: 1000px;
    padding-top: 45px;
  }

  .logo {
    font-size: 54px;
  }

  button {
    min-height: 58px;
    font-size: 19px;
  }

  input[type="text"],
  input[type="password"],
  textarea {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">ShitSub</div>
    <div class="tagline">
      English SRT → Natural Kerala Malayalam
    </div>
  </div>


  <!-- GEMINI API -->

  <div class="card">

    <div class="section-title">
      Gemini API Key
    </div>

    <label for="apiKey">
      API Key
    </label>

    <input
      id="apiKey"
      type="password"
      placeholder="Enter your Gemini API key"
      autocomplete="off"
    >

    <div class="checkbox-row">

      <input
        id="rememberKey"
        type="checkbox"
      >

      <label
        for="rememberKey"
        style="margin:0;"
      >
        Remember API key
      </label>

    </div>

  </div>


  <!-- SRT FILE -->

  <div class="card">

    <div class="section-title">
      Subtitle File
    </div>

    <label for="srtFile">
      Select English SRT
    </label>

    <input
      id="srtFile"
      class="file-input"
      type="file"
      accept=".srt,text/plain"
    >

    <div
      id="fileName"
      class="prompt-info"
    >
      No file selected.
    </div>

  </div>


  <!-- CUSTOM PROMPT -->

  <div class="card">

    <div class="section-title">
      Custom Prompt
    </div>

    <button
      id="editPromptBtn"
      type="button"
      class="secondary-btn"
    >
      Edit Prompt
    </button>


    <div
      id="promptEditor"
      class="prompt-editor"
    >

      <label for="customPrompt">
        Translation Prompt
      </label>

      <textarea
        id="customPrompt"
        placeholder="Enter your custom subtitle translation instructions..."
      ></textarea>

      <button
        id="savePromptBtn"
        type="button"
        class="save-btn"
      >
        Save Prompt
      </button>

      <div class="prompt-info">
        Your saved prompt will be remembered on this device.
      </div>

    </div>

  </div>


  <!-- TRANSLATE -->

  <div class="card">

    <button
      id="translateBtn"
      type="button"
      class="primary-btn"
    >
      Translate SRT
    </button>

    <div
      id="mainError"
      class="error"
    ></div>

  </div>


  <!-- PROGRESS -->

  <div
    id="statusCard"
    class="card status-card"
  >

    <div class="section-title">
      Translation Progress
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      Preparing...
    </div>

    <div class="progress-container">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </div>


  <!-- RESULT -->

  <div
    id="resultCard"
    class="card result-card"
  >

    <div class="section-title">
      Translation Complete
    </div>

    <div
      id="resultInfo"
      class="result-info"
    ></div>

    <button
      id="downloadBtn"
      type="button"
      class="download-btn"
    >
      Download Malayalam SRT
    </button>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    ShitSub • English SRT → Colloquial Kerala Malayalam
    <br>
    Created by Fadi

  </div>

</div>


<script>

/* ================================
   GEMINI CONFIGURATION
================================ */

const MODEL = "gemini-3.5-flash-lite";

const BATCH_SIZE = 75;

const MAX_RETRIES = 3;

const CONTEXT_COUNT = 4;

const API_URL =
  `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;


/* ================================
   DEFAULT TRANSLATION PROMPT
================================ */

const DEFAULT_PROMPT = `Translate English movie or TV subtitles into natural, colloquial Kerala Malayalam.

IMPORTANT RULES:

1. Use spoken Malayalam that people in Kerala naturally use in real conversations.
2. Do NOT translate word-for-word.
3. Do NOT use overly formal, literary, textbook, or old-fashioned Malayalam.
4. Preserve the original meaning, emotion, attitude, humor, sarcasm, anger, fear, romance, insults, and personality.
5. Keep the dialogue natural for the character and situation.
6. English words commonly used in Kerala conversations may be kept when they sound natural.
7. Do not unnecessarily convert every English technical or modern word into Malayalam.
8. Preserve swear words, insults, slang, vulgar expressions, and offensive language when they are present and relevant to the original dialogue. Do not censor or soften them.
9. Do not add explanations.
10. Do not remove meaning.
11. Do not summarize.
12. Keep each subtitle reasonably short and natural for reading.
13. Return only the translated dialogue.
14. Do not change subtitle numbering or timestamps.
15. The translation should sound like actual people speaking in Kerala, not like a machine translation.`;


/* ================================
   ELEMENTS
================================ */

const apiKeyInput =
  document.getElementById("apiKey");

const rememberKey =
  document.getElementById("rememberKey");

const srtFile =
  document.getElementById("srtFile");

const fileName =
  document.getElementById("fileName");

const editPromptBtn =
  document.getElementById("editPromptBtn");

const savePromptBtn =
  document.getElementById("savePromptBtn");

const promptEditor =
  document.getElementById("promptEditor");

const customPrompt =
  document.getElementById("customPrompt");

const translateBtn =
  document.getElementById("translateBtn");

const mainError =
  document.getElementById("mainError");

const statusCard =
  document.getElementById("statusCard");

const statusText =
  document.getElementById("statusText");

const progressBar =
  document.getElementById("progressBar");

const resultCard =
  document.getElementById("resultCard");

const resultInfo =
  document.getElementById("resultInfo");

const downloadBtn =
  document.getElementById("downloadBtn");


/* ================================
   VARIABLES
================================ */

let parsedSubtitles = [];

let translatedSubtitles = [];

let outputText = "";

let outputName = "";

let isTranslating = false;


/* ================================
   LOAD SAVED DATA
================================ */

const savedApiKey =
  localStorage.getItem(
    "shitsub_api_key"
  );

const savedPrompt =
  localStorage.getItem(
    "shitsub_custom_prompt"
  );


if (savedApiKey) {

  apiKeyInput.value =
    savedApiKey;

  rememberKey.checked =
    true;

}


customPrompt.value =
  savedPrompt ||
  DEFAULT_PROMPT;


/* ================================
   API KEY MEMORY
================================ */

rememberKey.addEventListener(
  "change",
  () => {

    if (rememberKey.checked) {

      if (apiKeyInput.value.trim()) {

        localStorage.setItem(
          "shitsub_api_key",
          apiKeyInput.value.trim()
        );

      }

    } else {

      localStorage.removeItem(
        "shitsub_api_key"
      );

    }

  }
);


apiKeyInput.addEventListener(
  "input",
  () => {

    if (rememberKey.checked) {

      localStorage.setItem(
        "shitsub_api_key",
        apiKeyInput.value.trim()
      );

    }

  }
);


/* ================================
   PROMPT EDITOR
================================ */

editPromptBtn.addEventListener(
  "click",
  () => {

    promptEditor.style.display =
      "block";

    editPromptBtn.style.display =
      "none";

    customPrompt.focus();

  }
);


savePromptBtn.addEventListener(
  "click",
  () => {

    const prompt =
      customPrompt.value.trim();


    if (!prompt) {

      customPrompt.value =
        DEFAULT_PROMPT;

    }


    localStorage.setItem(
      "shitsub_custom_prompt",
      customPrompt.value
    );


    promptEditor.style.display =
      "none";

    editPromptBtn.style.display =
      "block";

  }
);


/* ================================
   FILE SELECTION
================================ */

srtFile.addEventListener(
  "change",
  () => {

    if (
      srtFile.files &&
      srtFile.files.length > 0
    ) {

      fileName.textContent =
        srtFile.files[0].name;

    } else {

      fileName.textContent =
        "No file selected.";

    }

  }
);


/* ================================
   ERROR
================================ */

function showError(message) {

  mainError.textContent =
    message;

}


/* ================================
   STATUS
================================ */

function setStatus(
  message,
  percent = null
) {

  statusText.textContent =
    message;


  if (percent !== null) {

    progressBar.style.width =
      `${percent}%`;

  }

}


/* ================================
   SRT PARSER
================================ */

function parseSRT(text) {

  text =
    text.replace(
      /^\uFEFF/,
      ""
    );


  text =
    text.replace(
      /\r\n/g,
      "\n"
    );


  text =
    text.replace(
      /\r/g,
      "\n"
    );


  const blocks =
    text
      .split(/\n\s*\n/)
      .map(
        block => block.trim()
      )
      .filter(Boolean);


  const subtitles = [];


  for (const block of blocks) {

    const lines =
      block.split("\n");


    if (lines.length < 3) {
      continue;
    }


    const number =
      lines[0].trim();


    const timestamp =
      lines[1].trim();


    if (!/^\d+$/.test(number)) {
      continue;
    }


    if (!timestamp.includes("-->")) {
      continue;
    }


    const dialogue =
      lines
        .slice(2)
        .join("\n")
        .trim();


    subtitles.push({

      index: number,

      timestamp: timestamp,

      text: dialogue

    });

  }


  return subtitles;

}


/* ================================
   BUILD SRT
================================ */

function buildSRT(subtitles) {

  return subtitles
    .map(subtitle => {

      return [

        subtitle.index,

        subtitle.timestamp,

        subtitle.text

      ].join("\n");

    })
    .join("\n\n");

}


/* ================================
   DELAY
================================ */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* ================================
   GEMINI TRANSLATION
================================ */

async function translateBatch(
  batch,
  previousContext,
  nextContext
) {


  const userPrompt = `You are translating subtitles from English into natural spoken Kerala Malayalam.

CUSTOM TRANSLATION INSTRUCTIONS:

${customPrompt.value.trim() || DEFAULT_PROMPT}

PREVIOUS SUBTITLE CONTEXT:

${previousContext}

CURRENT SUBTITLES TO TRANSLATE:

${batch.map(item => {

  return `${item.index}
${item.timestamp}
${item.text}`;

}).join("\n\n")}

NEXT SUBTITLE CONTEXT:

${nextContext}

OUTPUT REQUIREMENTS:

Return a JSON array.

Each object must contain:

{
  "index": "original subtitle number",
  "translation": "Malayalam translation"
}

IMPORTANT:

- Return every current subtitle exactly once.
- Do not skip subtitles.
- Do not add subtitles.
- Keep the original index.
- Translate only the dialogue.
- Do not translate timestamps.
- Do not include markdown.
- Do not include explanations.
- Use natural colloquial Kerala Malayalam.
- Preserve emotion and character style.
- Preserve relevant slang, insults, profanity and vulgar language.
- Do not censor or sanitize dialogue.
- Do not make the Malayalam unnecessarily formal.`;


  const requestBody = {

    contents: [

      {

        role: "user",

        parts: [

          {
            text: userPrompt
          }

        ]

      }

    ],


    generationConfig: {

      temperature: 0.7,

      responseMimeType:
        "application/json",


      responseSchema: {

        type: "ARRAY",

        items: {

          type: "OBJECT",

          properties: {

            index: {
              type: "STRING"
            },

            translation: {
              type: "STRING"
            }

          },

          required: [

            "index",

            "translation"

          ]

        }

      }

    }

  };


  let lastError =
    null;


  for (
    let attempt = 1;
    attempt <= MAX_RETRIES;
    attempt++
  ) {

    try {


      const response =
        await fetch(

          `${API_URL}?key=${encodeURIComponent(
            apiKeyInput.value.trim()
          )}`,

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify(
                requestBody
              )

          }

        );


      if (!response.ok) {

        const errorText =
          await response.text();


        throw new Error(
          `Gemini API error ${response.status}: ${errorText}`
        );

      }


      const data =
        await response.json();


      const text =
        data
          ?.candidates?.[0]
          ?.content?.parts?.[0]
          ?.text;


      if (!text) {

        throw new Error(
          "Gemini returned an empty response."
        );

      }


      let parsed;


      try {

        parsed =
          JSON.parse(text);

      } catch {

        const cleaned =
          text
            .replace(
              /^```json\s*/i,
              ""
            )
            .replace(
              /^```\s*/i,
              ""
            )
            .replace(
              /\s*```$/i,
              ""
            )
            .trim();


        parsed =
          JSON.parse(cleaned);

      }


      if (!Array.isArray(parsed)) {

        throw new Error(
          "Gemini returned invalid subtitle data."
        );

      }


      return parsed;


    } catch (error) {

      lastError =
        error;


      if (
        attempt <
        MAX_RETRIES
      ) {

        setStatus(
          `Retrying batch... (${attempt}/${MAX_RETRIES})`
        );


        await sleep(
          1500 * attempt
        );

      }

    }

  }


  throw (
    lastError ||
    new Error(
      "Translation failed."
    )
  );

}


/* ================================
   TRANSLATE BUTTON
================================ */

translateBtn.addEventListener(
  "click",
  async () => {


    if (isTranslating) {
      return;
    }


    mainError.textContent =
      "";


    resultCard.style.display =
      "none";


    const apiKey =
      apiKeyInput.value.trim();


    if (!apiKey) {

      showError(
        "Please enter your Gemini API key."
      );

      return;

    }


    if (
      !srtFile.files ||
      srtFile.files.length === 0
    ) {

      showError(
        "Please select an English SRT file."
      );

      return;

    }


    const prompt =
      customPrompt.value.trim();


    if (!prompt) {

      customPrompt.value =
        DEFAULT_PROMPT;


      localStorage.setItem(
        "shitsub_custom_prompt",
        DEFAULT_PROMPT
      );

    }


    if (rememberKey.checked) {

      localStorage.setItem(
        "shitsub_api_key",
        apiKey
      );

    }


    isTranslating =
      true;


    translateBtn.disabled =
      true;


    translateBtn.textContent =
      "Translating...";


    statusCard.style.display =
      "block";


    try {


      const file =
        srtFile.files[0];


      const text =
        await file.text();


      parsedSubtitles =
        parseSRT(text);


      if (
        parsedSubtitles.length === 0
      ) {

        throw new Error(
          "No valid SRT subtitles were found."
        );

      }


      translatedSubtitles =
        new Array(
          parsedSubtitles.length
        );


      const total =
        parsedSubtitles.length;


      const totalBatches =
        Math.ceil(
          total /
          BATCH_SIZE
        );


      for (
        let batchNumber = 0;
        batchNumber < totalBatches;
        batchNumber++
      ) {


        const start =
          batchNumber *
          BATCH_SIZE;


        const end =
          Math.min(
            start +
              BATCH_SIZE,
            total
          );


        const batch =
          parsedSubtitles.slice(
            start,
            end
          );


        const contextStart =
          Math.max(
            0,
            start -
              CONTEXT_COUNT
          );


        const contextEnd =
          Math.min(
            total,
            end +
              CONTEXT_COUNT
          );


        const previousContext =
          parsedSubtitles
            .slice(
              contextStart,
              start
            )
            .map(
              item =>
                `${item.index}: ${item.text}`
            )
            .join("\n");


        const nextContext =
          parsedSubtitles
            .slice(
              end,
              contextEnd
            )
            .map(
              item =>
                `${item.index}: ${item.text}`
            )
            .join("\n");


        setStatus(

          `Translating subtitles ${start + 1}–${end} of ${total}...`,

          Math.round(
            (start / total) *
              100
          )

        );


        const result =
          await translateBatch(
            batch,
            previousContext,
            nextContext
          );


        const translationMap =
          new Map();


        for (
          const item of result
        ) {

          if (
            item &&
            item.index !== undefined &&
            typeof item.translation ===
              "string"
          ) {

            translationMap.set(

              String(
                item.index
              ),

              item.translation.trim()

            );

          }

        }


        for (
          let i = 0;
          i < batch.length;
          i++
        ) {


          const original =
            batch[i];


          const translated =
            translationMap.get(
              String(
                original.index
              )
            );


          if (
            translated !==
            undefined
          ) {


            translatedSubtitles[
              start + i
            ] = {

              index:
                original.index,

              timestamp:
                original.timestamp,

              text:
                translated

            };


          } else {


            translatedSubtitles[
              start + i
            ] = {

              index:
                original.index,

              timestamp:
                original.timestamp,

              text:
                original.text

            };

          }

        }


        setStatus(

          `Completed ${end} of ${total} subtitles.`,

          Math.round(
            (end / total) *
              100
          )

        );


        if (
          batchNumber <
          totalBatches - 1
        ) {

          await sleep(300);

        }

      }


      outputText =
        buildSRT(
          translatedSubtitles
        );


      const originalName =
        file.name.replace(
          /\.srt$/i,
          ""
        );


      outputName =
        `${originalName}_Malayalam.srt`;


      setStatus(

        `Translation complete: ${total} subtitles.`,

        100

      );


      resultInfo.innerHTML =

        `<div class="success">
          ${total} subtitles translated successfully.
        </div>

        <div style="margin-top:8px;">
          File: ${escapeHTML(outputName)}
        </div>`;


      resultCard.style.display =
        "block";


      setTimeout(
        () => {

          resultCard.scrollIntoView({

            behavior:
              "smooth",

            block:
              "center"

          });

        },
        200
      );


    } catch (error) {


      console.error(error);


      showError(

        error?.message ||
        "Translation failed."

      );


      setStatus(
        "Translation failed."
      );


    } finally {


      isTranslating =
        false;


      translateBtn.disabled =
        false;


      translateBtn.textContent =
        "Translate SRT";

    }

  }
);


/* ================================
   HTML ESCAPE
================================ */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ================================
   DOWNLOAD SRT
================================ */

downloadBtn.addEventListener(
  "click",
  () => {


    if (!outputText) {
      return;
    }


    const textWithBom =
      "\uFEFF" +
      outputText;


    /*
      ANDROID TV / APK
      Native Android download
    */

    if (

      typeof AndroidDownload !==
        "undefined" &&

      typeof AndroidDownload.saveSrt ===
        "function"

    ) {


      try {


        const encoder =
          new TextEncoder();


        const bytes =
          encoder.encode(
            textWithBom
          );


        let binary =
          "";


        const chunkSize =
          0x8000;


        for (
          let i = 0;
          i < bytes.length;
          i += chunkSize
        ) {


          const chunk =
            bytes.subarray(

              i,

              Math.min(
                i +
                  chunkSize,

                bytes.length
              )

            );


          binary +=
            String.fromCharCode(
              ...chunk
            );

        }


        const base64 =
          btoa(binary);


        AndroidDownload.saveSrt(

          base64,

          outputName

        );


        return;


      } catch (error) {


        console.error(
          "Android download failed:",
          error
        );

      }

    }


    /*
      BROWSER DOWNLOAD FALLBACK
    */

    try {


      const blob =
        new Blob(

          [textWithBom],

          {

            type:
              "application/x-subrip;charset=utf-8"

          }

        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        outputName;


      a.style.display =
        "none";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      setTimeout(
        () => {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );


    } catch (error) {


      console.error(error);


      showError(
        "Could not download the SRT file."
      );

    }

  }
);

promptEditor.style.display =

editPromptBtn.style.display =
  "block";


statusCard.style.display =
  "none";


resultCard.style.display =
